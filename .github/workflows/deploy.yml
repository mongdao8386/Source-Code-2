name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A deploy rebuilds the image on a 2-core box. Overlapping runs would fight
  # each other for CPU and could leave a half-built container serving traffic.
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # Placeholder public values: this job only proves the code compiles.
      # The real values are baked in when the VPS builds the image.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-placeholder
          NEXT_PUBLIC_ADMIN_PATH: /admin-cms

  deploy:
    name: Deploy to VPS
    needs: check
    runs-on: ubuntu-latest
    # Only deploy from the real repository, never from a fork's PR.
    if: github.repository == 'mongdao8386/Source-Code-2'
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # The build itself takes a few minutes on 2 vCPU.
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/studio

            # Refuse to deploy over uncommitted changes made on the server.
            if [ -n "$(git status --porcelain)" ]; then
              echo "Working tree on the VPS is dirty — refusing to overwrite."
              git status --short
              exit 1
            fi

            git fetch --prune origin
            git reset --hard origin/main

            # The old container keeps serving while the new image builds, so
            # the site stays up; it swaps only once the build succeeds.
            docker compose up -d --build

            # Drop dangling images so the disk does not fill up over time.
            docker image prune -f

            # The web container only exposes 3000 inside the compose network —
            # it is not published to the host — so poll the healthcheck that
            # docker-compose.yml already defines rather than curling a port
            # that is not there.
            echo "Waiting for the health check…"
            cid=$(docker compose ps -q web)
            for i in $(seq 1 36); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then
                echo "Healthy."
                exit 0
              fi
              if [ "$status" = "unhealthy" ]; then
                break
              fi
              sleep 5
            done

            echo "Health check never passed. Recent logs:"
            docker compose logs --tail 60 web
            exit 1
